# L4Desk landing — single-container nginx config (HTTP + ACME + HTTPS)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml text/xml application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Redirect map: once real LE certs exist, HTTP only serves ACME + redirect
    map $request_uri $https_redirect {
        default 1;
        "~*^/.well-known/acme-challenge/" 0;
        "~*^/healthz$" 0;
    }

    # HTTP: ACME webroot + landing + optional HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name l4desk.ru www.l4desk.ru _;

        root /usr/share/nginx/html;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            allow all;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            # After certbot succeeds, entrypoint touches /etc/nginx/ssl/enabled
            if (-f /etc/nginx/ssl/enabled) {
                return 301 https://$host$request_uri;
            }
            try_files $uri $uri/ =404;
        }
    }

    # HTTPS: real or self-signed certs under /etc/nginx/ssl/live/
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name l4desk.ru www.l4desk.ru _;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location = /api/contact {
            client_max_body_size 16k;
            proxy_pass http://contact:8081;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 40s;
            proxy_send_timeout 10s;
        }

        location ~* \.(?:css|js)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            try_files $uri =404;
        }

        location ~* \.(?:png|jpg|jpeg|gif|svg|webp|woff2?)$ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }
    # Keep the original L4Desk virtual host first for its localhost health check.
    include /etc/nginx/platerra.conf;
}
