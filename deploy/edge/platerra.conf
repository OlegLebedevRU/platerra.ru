server {
    listen 80;
    listen [::]:80;
    server_name platerra.ru www.platerra.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://platerra.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platerra.ru www.platerra.ru;
    ssl_certificate /etc/nginx/platerra-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/platerra-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PLATERRA_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($host = www.platerra.ru) { return 301 https://platerra.ru$request_uri; }
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $platerra_backend platerra-site:80;
    set $platerra_contact platerra-contact:8081;
    location = /api/contact {
        client_max_body_size 16k;
        proxy_pass http://$platerra_contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        proxy_send_timeout 10s;
    }
    location / {
        proxy_pass http://$platerra_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
