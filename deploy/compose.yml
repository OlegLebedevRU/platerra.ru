name: platerra
services:
  website:
    image: platerra-website:${RELEASE_TAG:-latest}
    build:
      context: ../website
      dockerfile: docker/Dockerfile
    container_name: platerra-website
    restart: unless-stopped
    depends_on:
      contact:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.50
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    networks:
      edge:
        aliases: [platerra-site]
  contact:
    image: platerra-contact:${RELEASE_TAG:-latest}
    build: ../contact
    container_name: platerra-contact
    restart: unless-stopped
    env_file: ../contact/.env.contact
    environment:
      CONTACT_OWNER_EMAIL: info@platerra.ru
      CONTACT_SENDER_EMAIL: noreply@platerra.ru
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      edge:
        aliases: [platerra-contact]
networks:
  edge:
    external: true
    name: l4desk-landing_default
