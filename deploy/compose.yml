name: platerra
services:
  website:
    image: platerra-website:${RELEASE_TAG:-latest}
    build:
      context: ../website
      dockerfile: docker/Dockerfile
    container_name: platerra-website
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.50
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    networks:
      edge:
        aliases: [platerra-site]
networks:
  edge:
    external: true
    name: l4desk-landing_default
