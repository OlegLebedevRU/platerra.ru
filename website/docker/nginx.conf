server {
    listen 80;
    server_name _;
    # Keep redirects relative so HTTPS stays HTTPS behind the edge proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    error_page 404 /404.html;
    location = /404.html { internal; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru; frame-src https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru https://*.yandex.ru; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /assets/ { expires 1d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location = /our-projects/ { return 301 /#solutions; }
    location = /projects/leo4-iot-platform/ { return 301 /solutions/leo4/; }
    location = /projects/puntopago-self-service/ { return 301 /solutions/platerraterminal/#project-puntopago; }
    location = /projects/pos-vending-yellowstone/ { return 301 /solutions/platerraterminal/#project-trailquipt; }
}
